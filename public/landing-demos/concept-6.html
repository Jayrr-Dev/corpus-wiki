<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --base: #131209; --surface: #181818; --raised: #1f1f1f; --hi: #272727; --line: #313131;
    --fade: #9b9b9b; --gold: #d9a441; --gold-pale: #f4d9a0; --glow: #f2c063; --ember: #8a5a1c;
    --green: #496748; --green-hover: #557a54; --green-light: #6e9a6c; --green-pale: #cfe3cd;
    --ink: #fff; --edge: #3c3c3c; --shadow: 1; /* --shadow scales every drop shadow */
    /* drawing colours for the glass and the pictures (read by the script too) */
    --glass: #0e0d07; --paper: #efe6d2; --rule: #3c3c3c; --rule-strong: #6a6a6a; --rule-soft: #5a5a5a; --axis: #4a4a4a; --flash: #fff4d6;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* LIGHT THEME: theme.js puts `light` on <html>; the accents and category colours stay the same */
  html.light {
    --base: #faf7ef; --surface: #f1ece0; --raised: #e9e3d4; --hi: #e2dbca; --line: #ddd5c3;
    --ink: #131209; --fade: #666666; --gold: #9a6b1c; --gold-pale: #7a531a; --green-light: #496748; --green-pale: #2f4a2e;
    --edge: #d3cab6; --shadow: .3;
    --glass: #fdfbf5; --paper: #fffdf8; --rule: #d3cab6; --rule-strong: #9a917e; --rule-soft: #bdb3a0; --axis: #bdb3a0; --flash: #9a6b1c;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--base); color: var(--ink); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  section.hero { position: relative; min-height: 100svh; padding: 96px 16px 64px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; text-align: center; }
  .wrap { width: 100%; max-width: 1152px; margin: 0 auto; }
  .tag { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); font-size: 12px; line-height: 16px; color: var(--gold); border: 1px solid var(--ember); border-radius: 9999px; padding: 4px 12px; white-space: nowrap; }
  .logo { position: absolute; top: 24px; left: 24px; display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .logo svg { width: 20px; height: 20px; color: var(--green-light); }
  h1 + .sub { margin-top: 40px; }
  h1 .mark { padding-bottom: 14px; background: linear-gradient(to right, #4285f4 0 20%, #ea4335 20% 40%, #fbbc04 40% 60%, #34a853 60% 80%, #673ab7 80%) 0 100% / 100% 6px no-repeat; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  h1 { max-width: 900px; margin: 0 auto; font-size: 36px; line-height: 1; font-weight: 700; letter-spacing: -0.4px; text-transform: uppercase; text-wrap: balance; color: var(--ink); padding-bottom: 4px; }
  .sub { max-width: 680px; margin: 16px auto 0; font-size: 18px; line-height: 28px; color: color-mix(in srgb, var(--ink) 65%, transparent); text-wrap: pretty; }
  .cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; background: var(--green); color: #fff; text-decoration: none; font-size: 16px; font-weight: 600; padding: 8px 12px; border-radius: 12px; transition: background-color .3s var(--ease), transform .3s var(--ease); }
  .cta:hover { background: var(--green-hover); } .cta:active { transform: scale(.98); }
  .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (min-width: 768px) { h1 { font-size: 60px; line-height: 1; } .sub { font-size: 20px; } }

  /* STAGE: drawn at 1152 wide, scaled to fit the column */
  .fit { margin-top: 64px; position: relative; }
  .stage { position: absolute; left: 0; top: 0; width: 1152px; height: 400px; transform-origin: top left; text-align: left; }
  /* the belts fade out at both ends, so files seem to come from and go off into the page */
  .stage { -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); }
  .belt { position: absolute; top: 300px; height: 16px; border-radius: 8px; background: repeating-linear-gradient(to right, var(--raised) 0 12px, var(--hi) 12px 24px); }
  .belt.left { left: 0; width: 400px; } .belt.right { left: 752px; width: 400px; }
  .wheel { position: absolute; top: 324px; width: 32px; height: 32px; border-radius: 9999px; background: var(--line); }
  .item { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .out { position: absolute; left: 0; top: 0; width: 130px; padding: 8px 8px 10px; border-radius: 14px; background: var(--raised); border: 1px solid var(--edge); box-shadow: 0 12px 24px rgb(0 0 0 / calc(.4 * var(--shadow))); transform-origin: 50% 100%; will-change: transform, opacity; }
  .out svg { display: block; width: 112px; height: 72px; border-radius: 8px; background: var(--surface); }
  .out span { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .out i { font-size: 14px; }

  /* MACHINE: a green housing with a glass window onto the growing graph */
  .machine { position: absolute; left: 376px; top: 20px; width: 400px; height: 296px; border-radius: 24px; background: var(--green); border: 2px solid var(--green-light); padding: 12px; }
  .glass { position: relative; width: 100%; height: 232px; border-radius: 12px; background: var(--glass); border: 1px solid #2c3f2b; overflow: hidden; }
  .glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glass::after { content: ""; position: absolute; left: 12px; top: 8px; width: 120px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .status { display: flex; align-items: center; justify-content: space-between; height: 32px; margin-top: 8px; padding: 0 8px; font-size: 12px; line-height: 16px; color: #cfe3cd; } /* on the green housing, light in both themes */
  .status .left { display: flex; align-items: center; gap: 8px; }
  .status svg { width: 16px; height: 16px; color: #fff; }
  .lamp { width: 8px; height: 8px; border-radius: 9999px; background: #34a853; box-shadow: 0 0 12px #34a853; transition: opacity .3s var(--ease), background-color .3s var(--ease), box-shadow .3s var(--ease); }
  .lamp.idle { background: #131209; box-shadow: none; } .lamp.busy { background: #fbbc04; box-shadow: 0 0 12px #fbbc04; } /* black waiting, yellow processing, green once outputs start */
  .mouth { position: absolute; top: 236px; width: 8px; height: 64px; border-radius: 4px; background: #2c3f2b; }
  .mouth.l { left: 368px; } .mouth.r { left: 776px; }
  @media (prefers-reduced-motion: reduce) { .lamp { box-shadow: none; } }
</style>
<script>
// EMBED MODE (?embed): the landing page supplies the headline, so hide this page's own
// heading, tag and logo, drop the full-screen height, and report the height to the parent.
if (location.search.includes("embed")) {
  document.documentElement.classList.add("embed");
  const send = () => parent.postMessage({ landingDemo: location.pathname, height: document.documentElement.scrollHeight }, location.origin);
  addEventListener("load", () => { send(); new ResizeObserver(send).observe(document.body); });
}
</script>
<style>
/* transparent: the hero's shader backdrop shows through around the machine */
html.embed, html.embed body { background: transparent; }
html.embed .tag, html.embed .logo, html.embed .intro, html.embed .wrap > div:first-child:not(.stage):not(.demo):not(.intro):has(h1) { display: none !important; }
html.embed section.hero { min-height: 0; padding: 24px 16px; overflow: visible; }
html.embed .wrap { grid-template-columns: 1fr !important; }
html.embed .wrap > h1, html.embed .wrap > .sub, html.embed .wrap > .cta { display: none !important; }
html.embed .demo, html.embed .fit, html.embed .week { margin-top: 0; }
html.embed .week + .demo { margin-top: 24px; }
</style>

<svg width="0" height="0" style="position:absolute"><symbol id="mark" viewBox="5 11 90 82"><path fill="currentColor" d="M12 18C30 18 42 26 50 38C58 26 70 18 88 18V35C76 35 65 41 56 47V62C65 55 76 52 88 52V64C71 64 59 72 50 86C41 72 29 64 12 64V52C24 52 35 55 44 62V47C35 41 24 35 12 35Z"/></symbol></svg>

<section class="hero">
  <span class="tag">Concept 6 · The glass machine</span>
  <div class="logo"><svg><use href="#mark"/></svg>Corpus Wiki</div>
  <div class="wrap">
    <h1>Your automated<br><span class="mark">knowledge base</span></h1>
    <p class="sub">Add your files. Corpus Wiki sorts them out, writes simple pages for your team and keeps them up to date.</p>
    <a class="cta" href="#">Start free <i class="ph ph-arrow-right"></i></a>
    <div class="fit" aria-hidden="true">
      <div class="stage">
        <div class="belt left"></div><div class="belt right"></div>
        <span class="wheel" style="left:24px"></span><span class="wheel" style="left:304px"></span>
        <span class="wheel" style="left:824px"></span><span class="wheel" style="left:1096px"></span>

        <div id="items"></div>

        <div class="machine">
          <div class="glass"><canvas id="graph"></canvas></div>
          <div class="status"><span class="left"><svg><use href="#mark"/></svg><span id="phase">Waiting for files</span></span><span id="count">0 facts</span><span class="lamp" id="lamp"></span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<template id="t-doc"><svg width="76" height="88" viewBox="0 0 76 88"><path d="M4 86 L14 6 L62 0 L74 26 L58 86 Z" style="fill:var(--paper)"/><path d="M22 28 L56 24 M22 40 L52 37 M24 52 L46 50" stroke="#c9bc9f" stroke-width="4" stroke-linecap="round"/></svg></template>
<template id="t-photo"><svg width="84" height="68" viewBox="0 0 84 68"><g transform="rotate(-6 42 34)"><rect x="4" y="6" width="76" height="56" rx="6" fill="#2a3b2a"/><circle cx="24" cy="24" r="7" fill="#fbbc04"/><path d="M8 58 L36 34 L52 48 L68 32 L78 58 Z" fill="#34a853"/></g></svg></template>
<template id="t-video"><svg width="88" height="60" viewBox="0 0 88 60"><g transform="rotate(5 44 30)"><rect x="4" y="8" width="80" height="46" rx="14" fill="#ea4335"/><path d="M36 20 L56 31 L36 42 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g></svg></template>
<template id="t-link"><svg width="72" height="56" viewBox="0 0 72 56"><rect x="2" y="6" width="68" height="46" rx="8" style="fill:var(--hi);stroke:var(--edge)"/><path d="M24 34 L34 24 M30 20 L34 16 a7 7 0 0 1 10 10 L40 30 M42 36 L38 40 a7 7 0 0 1 -10 -10 L32 26" stroke="#4285f4" stroke-width="3" fill="none" stroke-linecap="round"/></svg></template>
<template id="t-note"><svg width="64" height="64" viewBox="0 0 64 64"><g transform="rotate(8 32 32)"><rect x="6" y="6" width="52" height="52" rx="4" fill="#fbbc04"/><path d="M16 22 H46 M16 32 H42 M16 42 H34" stroke="#a87a00" stroke-width="3.5" stroke-linecap="round"/></g></svg></template>

<script>
// =====================================================================
// THE GLASS MACHINE: files ride in on the left, a graph grows inside the
// window (one point, then many), the points sort into labelled groups,
// then the finished outputs ride out on the right. One loop of 24 seconds.
// =====================================================================
const LOOP = 28, FEED_END = 10.5, ORG_START = 10.5, ORG_END = 14, LABEL_START = 13.5, OUT_START = 15.5, FADE_START = 26.6;
const W = 376, H = 232; // glass size in stage pixels (machine 400 minus padding)
const P = { blue: "#4285f4", red: "#ea4335", yellow: "#fbbc04", green: "#34a853", purple: "#673ab7" }; // category colours
const GROUPS = [
  { name: "Projects", color: P.blue, cx: 72, cy: 82 },
  { name: "People", color: P.red, cx: 190, cy: 74 },
  { name: "Policies", color: P.yellow, cx: 306, cy: 84 },
  { name: "Clients", color: P.green, cx: 126, cy: 180 },
  { name: "Terms", color: P.purple, cx: 256, cy: 180 },
];
const INPUTS = ["t-doc", "t-photo", "t-video", "t-note", "t-doc", "t-link", "t-video", "t-doc"];
const FACTS = 500; // points born while the files feed in
const FIRST = [1, 2, 3]; // the first files add a handful each: one point, then a few; the rest ramp up to FACTS
const OUTPUTS = [
  ["ph-article", "Wiki pages", P.blue], ["ph-newspaper", "Articles", P.red], ["ph-graduation-cap", "Tutorials", P.yellow], ["ph-monitor-play", "Tutorial videos", P.green],
  ["ph-book-open-text", "Glossary", P.purple], ["ph-address-book", "Client list", P.blue], ["ph-exam", "Quizzes", P.red],
  ["ph-users-three", "Stakeholders", P.yellow], ["ph-image-square", "Visuals", P.green], ["ph-robot", "Agent context", P.purple],
];
const ARRIVE = 2.6, SPACING = 1.15; // seconds on the belt, seconds between files
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const mix = (a, b, t) => a + (b - a) * t;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

// SEEDED RANDOM: the same graph every loop, so it reads as one story
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const nodes = [], edges = [];
// after the first files, birth times invert an ease-in-out-cubic curve, so the count accelerates then settles
const births = FIRST.flatMap((count, f) => Array.from({ length: count }, (_, k) => f * SPACING + ARRIVE + k * 0.08));
const RAMP = FACTS - births.length, RAMP_START = FIRST.length * SPACING + ARRIVE, RAMP_SPAN = (INPUTS.length - 1 - FIRST.length) * SPACING + 0.4;
for (let i = 1; i <= RAMP; i++) { const c = i / RAMP; births.push(RAMP_START + RAMP_SPAN * (c < 0.5 ? Math.cbrt(c / 4) : 1 - Math.cbrt(2 * (1 - c)) / 2)); }
for (let i = 0; i < FACTS; i++) {
  const g = i === 0 ? 0 : Math.floor(rnd() * GROUPS.length), a = rnd() * Math.PI * 2, r = 4 + Math.sqrt(rnd()) * 34;
  const n = { born: births[i], g, sx: 16 + rnd() * (W - 32), sy: 16 + rnd() * (H - 32), tx: GROUPS[g].cx + Math.cos(a) * r, ty: GROUPS[g].cy + Math.sin(a) * r * 0.8, size: 1.1 + rnd() * 1.6 };
  if (nodes.length) {
    const same = nodes.filter((m) => m.g === g), pick = same.length && rnd() < 0.8 ? same[Math.floor(rnd() * same.length)] : nodes[Math.floor(rnd() * nodes.length)];
    edges.push([pick, n]);
  }
  nodes.push(n);
}
nodes[0].size = 6;

// DOM: one element per file and per output, moved with transforms only
const itemsEl = document.getElementById("items"), outsEl = document.getElementById("outs");
const items = INPUTS.map((id) => { const d = document.createElement("div"); d.className = "item"; d.append(document.getElementById(id).content.cloneNode(true)); itemsEl.append(d); return d; });
// each output is drawn as the thing it is, like the files on the left belt
// THEME: drawing colours come from the CSS variables, so they follow light and dark
const C = {};
function readColours() { const cs = getComputedStyle(document.documentElement); ["paper", "rule", "rule-strong", "rule-soft", "axis", "flash", "surface", "raised", "ink", "fade"].forEach((n) => { C[n] = cs.getPropertyValue(`--${n}`).trim(); }); }
readColours();
const INK = "#c9bc9f";
const lines = (x, ys, w, color = INK) => ys.map((y, i) => `<path d="M${x} ${y} H${x + w[i % w.length]}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`).join("");
const PICTURES = {
  "Wiki pages": (c) => `<rect x="30" y="10" width="56" height="58" rx="4" fill="${C.rule}"/><rect x="36" y="6" width="56" height="58" rx="4" fill="${C.paper}"/><rect x="43" y="13" width="26" height="6" rx="3" fill="${c}"/>${lines(43, [27, 35, 43, 51], [42, 36, 42, 28])}`,
  "Articles": (c) => `<rect x="28" y="6" width="56" height="60" rx="4" fill="${C.paper}"/><rect x="34" y="12" width="44" height="20" rx="2" fill="#2a3b2a"/><path d="M34 32 L46 22 L54 28 L64 18 L78 32 Z" fill="${c}"/>${lines(34, [40, 47, 54], [18, 18, 14])}${lines(60, [40, 47, 54], [18, 18, 12])}`,
  "Tutorials": (c) => [16, 36, 56].map((y, i) => `<circle cx="28" cy="${y}" r="7" fill="${i < 2 ? c : "none"}" stroke="${i < 2 ? c : C["rule-soft"]}" stroke-width="2"/>${i < 2 ? `<path d="M24.5 ${y} l2.5 2.5 l4.5 -5" stroke="${C.surface}" stroke-width="2" fill="none" stroke-linecap="round"/>` : ""}${lines(42, [y], [i === 2 ? 34 : 50], i < 2 ? C["rule-strong"] : C.rule)}`).join(""),
  "Tutorial videos": (c) => `<rect x="12" y="6" width="88" height="54" rx="5" fill="#3a2a14"/><path d="M12 46 L36 30 L50 40 L68 26 L100 46 V55 a5 5 0 0 1 -5 5 H17 a5 5 0 0 1 -5 -5 Z" fill="#2a3b2a"/><circle cx="56" cy="31" r="12" fill="rgba(0,0,0,.45)"/><path d="M52 25 L62 31 L52 37 Z" fill="${c}"/><rect x="12" y="65" width="88" height="3" rx="1.5" fill="${C.rule}"/><rect x="12" y="65" width="34" height="3" rx="1.5" fill="${c}"/><circle cx="46" cy="66.5" r="3" fill="${C.flash}"/>`,
  "Glossary": (c) => `<path d="M56 12 C46 6 30 6 16 10 V64 C30 60 46 60 56 66 Z" fill="${C.paper}"/><path d="M56 12 C66 6 82 6 96 10 V64 C82 60 66 60 56 66 Z" fill="#e3d8bf"/><rect x="23" y="18" width="16" height="5" rx="2.5" fill="${c}"/>${lines(23, [29, 35], [24, 20])}<rect x="23" y="43" width="12" height="5" rx="2.5" fill="${c}"/>${lines(23, [54], [22])}<rect x="63" y="18" width="18" height="5" rx="2.5" fill="${c}"/>${lines(63, [29, 35], [24, 18])}<rect x="63" y="43" width="14" height="5" rx="2.5" fill="${c}"/>${lines(63, [54], [22])}`,
  "Client list": (c) => [16, 36, 56].map((y, i) => `<circle cx="26" cy="${y}" r="7" fill="${c}" opacity="${1 - i * 0.25}"/>${lines(40, [y - 3], [[44, 36, 40][i]], C["rule-strong"])}${lines(40, [y + 4], [[26, 30, 22][i]], C.rule)}`).join(""),
  "Quizzes": (c) => `<rect x="24" y="6" width="64" height="60" rx="4" fill="${C.paper}"/>${lines(32, [16], [44], "#8d8169")}${[30, 42, 54].map((y, i) => `<circle cx="36" cy="${y}" r="4.5" fill="${i === 1 ? c : "none"}" stroke="${i === 1 ? c : INK}" stroke-width="2"/>${lines(46, [y], [[30, 34, 24][i]])}`).join("")}`,
  "Stakeholders": (c) => `<path d="M56 30 L28 50 M56 30 L84 50 M28 50 L84 50" stroke="${C.axis}" stroke-width="2"/>${[[56, 26, 10, c], [28, 50, 8, P.blue], [84, 50, 8, P.red]].map(([x, y, r, f]) => `<circle cx="${x}" cy="${y}" r="${r + 3}" fill="${C.surface}"/><circle cx="${x}" cy="${y - r * 0.25}" r="${r * 0.45}" fill="${f}"/><path d="M${x - r * 0.75} ${y + r * 0.8} a${r * 0.75} ${r * 0.6} 0 0 1 ${r * 1.5} 0 Z" fill="${f}"/>`).join("")}`,
  "Visuals": (c) => `<path d="M20 62 H92" stroke="${C.axis}" stroke-width="2"/>${[[24, 30, P.blue], [40, 18, P.red], [56, 40, P.yellow], [72, 26, c]].map(([x, h, f]) => `<rect x="${x}" y="${58 - h}" width="12" height="${h}" rx="2" fill="${f}"/>`).join("")}<path d="M24 34 L46 20 L62 26 L84 10" stroke="${C.flash}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  "Agent context": (c) => `<rect x="12" y="6" width="88" height="60" rx="5" fill="#141414" stroke="${C.rule}"/><circle cx="20" cy="13" r="2" fill="#5a5a5a"/><circle cx="27" cy="13" r="2" fill="#5a5a5a"/><circle cx="34" cy="13" r="2" fill="#5a5a5a"/><path d="M20 26 l5 4 -5 4" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>${lines(30, [30], [40], "#cfe3cd")}${lines(20, [43, 51], [62, 48], "#5a5a5a")}<rect x="20" y="56" width="5" height="6" fill="${c}"/>`,
};
const outs = OUTPUTS.map(() => { const d = document.createElement("div"); d.className = "out"; outsEl.append(d); return d; });
const paintOuts = () => outs.forEach((d, i) => { const [icon, label, color] = OUTPUTS[i]; d.innerHTML = `<svg viewBox="0 0 112 72">${PICTURES[label](color)}</svg><span><i class="ph-duotone ${icon}" style="color:${color}"></i>${label}</span>`; });
paintOuts();

const canvas = document.getElementById("graph"), ctx = canvas.getContext("2d");
const phaseEl = document.getElementById("phase"), countEl = document.getElementById("count"), lamp = document.getElementById("lamp");
function sizeCanvas() { const dpr = devicePixelRatio || 1; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
sizeCanvas();

function draw(t) {
  const org = ease((t - ORG_START) / (ORG_END - ORG_START)), lab = ease((t - LABEL_START) / 1.2), fade = 1 - ease((t - FADE_START) / 1.2);
  ctx.clearRect(0, 0, W, H);
  const pos = (n) => [mix(n.sx, n.tx, org), mix(n.sy, n.ty, org)];
  const grow = (n) => ease((t - n.born) / 0.6);
  // group halos once organized
  GROUPS.forEach((g) => { ctx.globalAlpha = 0.1 * org * fade; ctx.fillStyle = g.color; ctx.beginPath(); ctx.arc(g.cx, g.cy, 42, 0, 7); ctx.fill(); });
  // edges
  ctx.lineWidth = 1;
  edges.forEach(([a, b]) => { const v = Math.min(grow(a), grow(b)); if (!v) return; const [ax, ay] = pos(a), [bx, by] = pos(b); ctx.globalAlpha = 0.16 * v * fade * (a.g === b.g ? 1 : 1 - org * 0.7); ctx.strokeStyle = a.g === b.g ? GROUPS[a.g].color : C.fade; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); });
  // nodes: grey while scattered, group colour as they sort
  let alive = 0;
  nodes.forEach((n) => {
    const v = grow(n); if (!v) return; alive++;
    const [x, y] = pos(n), c = hex(GROUPS[n.g].color), k = 0.35 + 0.65 * org;
    ctx.globalAlpha = fade; ctx.fillStyle = `rgb(${mix(155, c[0], k)},${mix(155, c[1], k)},${mix(155, c[2], k)})`;
    ctx.beginPath(); ctx.arc(x, y, n.size * v, 0, 7); ctx.fill();
    const fresh = clamp(1 - (t - n.born) / 0.9); // a new point flashes as it lands
    if (fresh > 0) { ctx.globalAlpha = fresh * 0.4 * fade; ctx.strokeStyle = C.flash; ctx.beginPath(); ctx.arc(x, y, n.size + 6 * (1 - fresh), 0, 7); ctx.stroke(); }
  });
  // labels
  ctx.font = "500 12px Geist, system-ui"; ctx.textAlign = "center";
  GROUPS.forEach((g, i) => {
    const v = ease((t - LABEL_START - i * 0.25) / 0.8) * fade; if (!v) return;
    const w = ctx.measureText(g.name).width + 16, y = g.cy - 50 + (1 - v) * 6;
    ctx.globalAlpha = v; ctx.fillStyle = C.raised; ctx.strokeStyle = g.color;
    ctx.beginPath(); ctx.roundRect(g.cx - w / 2, y - 12, w, 22, 11); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.fillText(g.name, g.cx, y + 3);
  });
  ctx.globalAlpha = 1;
  return alive;
}

function frame(now) {
  const t = (now / 1000) % LOOP;
  // files on the left belt: ride in, shrink into the machine
  items.forEach((el, i) => {
    const s = (t - i * SPACING) / ARRIVE;
    if (s < 0 || s > 1.15) { el.style.opacity = 0; return; }
    const x = mix(-90, 330, ease(Math.min(s, 1) * 0.98)), w = el.firstElementChild.width.baseVal.value, h = el.firstElementChild.height.baseVal.value;
    const gone = clamp((s - 0.92) / 0.2);
    el.style.opacity = clamp(s * 6) * (1 - gone);
    el.style.transform = `translate(${x + gone * 50}px, ${300 - h}px) scale(${1 - gone * 0.5})`;
  });
  // outputs on the right belt: pop out of the machine one by one, ride off
  outs.forEach((el, i) => {
    const s = (t - OUT_START - i * 0.95) / 3.0;
    if (s < 0 || s > 1) { el.style.opacity = 0; return; }
    el.style.opacity = clamp(s * 10) * clamp((1 - s) * 8);
    const pop = ease(s * 4);
    el.style.transform = `translate(${mix(700, 1200, s)}px, ${184 - (1 - pop) * 16}px) scale(${mix(0.7, 1, pop)}) rotate(${(i % 2 ? 2 : -2) * pop}deg)`;
  });
  const alive = draw(t);
  countEl.textContent = `${alive} ${alive === 1 ? "fact" : "facts"}`;
  phaseEl.textContent = t < 2.4 ? "Waiting for files" : t < RAMP_START ? "Reading files" : t < FEED_END ? "Converting to knowledge units" : t < LABEL_START ? "Organizing" : t < OUT_START ? "Naming groups" : t < FADE_START ? "Writing outputs" : "Ready for more";
  const busy = t > 2.4 && t < OUT_START;
  lamp.classList.toggle("idle", t <= 2.4); lamp.classList.toggle("busy", busy);
  lamp.style.opacity = !busy || Math.sin(now / 160) > 0 ? 1 : 0.35;
  requestAnimationFrame(frame);
}

// FIT: scale the 1152 wide stage to the column
const fit = document.querySelector(".fit"), stage = document.querySelector(".stage");
function resize() { const s = Math.min(1, fit.clientWidth / 1152); stage.style.transform = `scale(${s})`; fit.style.height = `${400 * s}px`; }
addEventListener("resize", resize); resize();

// THEME CHANGE: re-read the colours and repaint the pictures (the canvas redraws every frame)
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
new MutationObserver(() => { readColours(); paintOuts(); if (still) draw(OUT_START + 1); }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

if (still) {
  // STILL: the organised, labelled graph with every output lined up
  draw(OUT_START + 1); countEl.textContent = `${nodes.length} facts`; phaseEl.textContent = "Ready";
  outs.forEach((el, i) => { el.style.transform = `translate(${790 + (i % 3) * 120}px, ${Math.floor(i / 3) * 96 - 24}px) scale(0.78)`; });
} else {
  document.fonts.ready.then(() => requestAnimationFrame(frame));
}
</script>
</body>
</html>
