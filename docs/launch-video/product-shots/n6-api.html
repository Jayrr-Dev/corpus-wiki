<!doctype html>
<!-- Nemotron section, 0:26.4–0:33.3: "Token Factory gives us one API for all of them, with structured output, so every change comes back valid."
     The request mirrors lib/ai/chat.ts (response_format json_schema, strict) against TOKEN_FACTORY_BASE_URL in lib/ai/config.ts. -->
<html class="light"><head><meta charset="utf-8"><title>N6 API</title>
<link rel="stylesheet" href="assets/app.css">
<script src="engine.js"></script>
<style>
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #faf9f6; color: #172522; font-family: var(--font-sans, Inter, sans-serif); }
  #cursor { display: none !important; }
  .row { position: absolute; left: 140px; right: 140px; top: 170px; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; }
  .card { border: 1px solid #dfddd7; background: #ffffff; box-shadow: 0 1px 2px rgba(23,37,34,.05); border-radius: 14px; overflow: hidden; }
  .card .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #dfddd7; background: #f3f2ee; font-size: 16px; color: #5c5c5c; }
  .card .hd b { color: #172522; font-weight: 600; }
  pre { margin: 0; padding: 20px 22px; font-family: var(--font-mono, "JetBrains Mono", monospace); font-size: 19px; line-height: 1.6; color: #2b3330; white-space: pre; min-height: 560px; }
  .k { color: #496748; } .s { color: #a5521c; } .c { color: #8a8a8a; } .n { color: #0069a4; }
  .arrow { text-align: center; font-size: 46px; color: #496748; }
  .ok { position: absolute; left: 50%; top: 820px; transform: translateX(-50%); display: flex; gap: 14px; }
  .chip { display: flex; align-items: center; gap: 10px; border: 1px solid #577d4a; background: rgba(116,166,98,.12); color: #3f6a35; border-radius: 999px; padding: 12px 22px; font-size: 22px; font-weight: 600; }
  .title { position: absolute; top: 80px; width: 100%; text-align: center; font-size: 40px; font-weight: 600; }
  .title span { color: #5c5c5c; font-weight: 400; }
</style></head>
<body>
<div class="title" id="ti">One API for every model <span>· structured output</span></div>
<div class="row">
  <div class="card" id="req"><div class="hd"><span class="rounded px-1.5 py-0.5 text-xs font-medium" style="background:var(--color-emerald-100);color:var(--color-emerald-950)">POST</span><b>api.tokenfactory.nebius.com/v1/chat/completions</b></div><pre id="rq"></pre></div>
  <div class="arrow" id="ar">→</div>
  <div class="card" id="res"><div class="hd"><span class="rounded px-1.5 py-0.5 text-xs font-medium" style="background:var(--color-blue-100);color:var(--color-blue-950)">200</span><b>ChangeSet</b></div><pre id="rs"></pre></div>
</div>
<div class="ok" id="ok"><div class="chip">✓ Matches the schema</div><div class="chip">✓ Checked by Change control</div></div>
<script>
const REQ = [
  ['{', ''],
  ['  <span class="k">"model"</span>: <span class="s">"nvidia/nemotron-3-super-120b-a12b"</span>,', ''],
  ['  <span class="k">"messages"</span>: [ <span class="c">… the upload and current knowledge …</span> ],', ''],
  ['  <span class="k">"temperature"</span>: <span class="n">0</span>,', ''],
  ['  <span class="k">"response_format"</span>: {', ''],
  ['    <span class="k">"type"</span>: <span class="s">"json_schema"</span>,', ''],
  ['    <span class="k">"json_schema"</span>: {', ''],
  ['      <span class="k">"name"</span>: <span class="s">"change_set"</span>,', ''],
  ['      <span class="k">"schema"</span>: <span class="c">{ … }</span>,', ''],
  ['      <span class="k">"strict"</span>: <span class="n">true</span>', ''],
  ['    }', ''], ['  }', ''], ['}', ''],
];
const RES = [
  ['{ <span class="k">"actions"</span>: [', ''],
  ['  { <span class="k">"type"</span>: <span class="s">"add_claim"</span>,', ''],
  ['    <span class="k">"content"</span>: <span class="s">"Billing sync runs every hour."</span> },', ''],
  ['  { <span class="k">"type"</span>: <span class="s">"revise_claim"</span>,', ''],
  ['    <span class="k">"content"</span>: <span class="s">"Retries a failed batch 5 times."</span> },', ''],
  ['  { <span class="k">"type"</span>: <span class="s">"link"</span>,', ''],
  ['    <span class="k">"from"</span>: <span class="s">"Billing sync"</span>, <span class="k">"to"</span>: <span class="s">"Ledgerly"</span> }', ''],
  [']}', ''],
];
window.SCENE = { duration: 6.9, frame(t) {
  camera(t, 6.9, 1.0, 1.025);
  const a = easeOut(seg(t, 0.0, 0.4)); $("#ti").style.opacity = a;
  [["#req", 0.1], ["#ar", 2.4], ["#res", 2.6]].forEach(([s, at]) => { const p = easeOut(seg(t, at, at + 0.4)); $(s).style.opacity = p; $(s).style.transform = `translateY(${(1 - p) * 14}px)`; });
  const nq = Math.round(REQ.length * seg(t, 0.3, 2.3));
  $("#rq").innerHTML = REQ.slice(0, nq).map((l) => l[0]).join("\n");
  const nr = Math.round(RES.length * seg(t, 2.8, 4.6));
  $("#rs").innerHTML = RES.slice(0, nr).map((l) => l[0]).join("\n");
  $$(".chip").forEach((c, i) => { const p = easeOut(seg(t, 4.8 + i * 0.3, 5.2 + i * 0.3)); c.style.opacity = p; c.style.transform = `scale(${0.92 + 0.08 * p})`; });
}};
</script>
</body></html>
