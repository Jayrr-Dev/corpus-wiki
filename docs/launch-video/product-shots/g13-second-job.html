<!doctype html>
<!-- Shot 13, 0:56.5 (about 2.7 s): "It turns into a second job."
     A clock spins fast beside a caption stack: "tag it", "link it", "file it", "forget it". -->
<html class="dark"><head><meta charset="utf-8"><title>G13 Second Job</title>
<link rel="stylesheet" href="assets/app.css">
<script src="engine.js"></script>
<style>
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1e1e1e; color: #dcdcdc; font-family: var(--font-sans, Inter, sans-serif); }
  #cursor { display: none !important; }
  .clock { position: absolute; left: 330px; top: 240px; width: 600px; height: 600px; }
  .stack { position: absolute; left: 1070px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 18px; }
  .w { font-size: 104px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
  .w.last { color: #e05252; }
</style></head>
<body>
<svg class="clock" id="clock" viewBox="-150 -150 300 300">
  <circle r="138" fill="#262626" stroke="#363636" stroke-width="3"/>
  <circle r="124" fill="none" stroke="#2f2f2f" stroke-width="1.5"/>
  <g id="ticks"></g>
  <path id="trail" fill="#8fae8d" fill-opacity=".14"/>
  <line id="hr" x1="0" y1="10" x2="0" y2="-62" stroke="#dcdcdc" stroke-width="9" stroke-linecap="round"/>
  <line id="mn" x1="0" y1="14" x2="0" y2="-104" stroke="#8fae8d" stroke-width="5" stroke-linecap="round"/>
  <circle r="9" fill="#dcdcdc"/>
</svg>
<div class="stack" id="stack">
  <div class="w">tag it</div><div class="w">link it</div><div class="w">file it</div><div class="w last">forget it</div>
</div>
<script>
window.SCENE = { duration: 2.7,
  setup() {
    $("#ticks").innerHTML = Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6, r1 = i % 3 ? 112 : 104;
      return `<line x1="${Math.sin(a) * r1}" y1="${-Math.cos(a) * r1}" x2="${Math.sin(a) * 122}" y2="${-Math.cos(a) * 122}" stroke="${i % 3 ? "#4a4a4a" : "#a3a3a3"}" stroke-width="${i % 3 ? 3 : 5}" stroke-linecap="round"/>`; }).join("");
  },
  frame(t) {
    camera(t, 2.7, 1.0, 1.04);
    const c = easeOut(seg(t, 0, 0.35));
    $("#clock").style.opacity = c; $("#clock").style.transform = `scale(${0.94 + 0.06 * c})`;
    // The minute hand speeds up: hours go by
    const turns = 0.2 * t + 0.85 * t * t;
    const mn = turns * 360, hr = mn / 12 + 300;
    $("#mn").setAttribute("transform", `rotate(${mn})`);
    $("#hr").setAttribute("transform", `rotate(${hr})`);
    // A soft trail behind the minute hand
    const span = Math.min(80, 10 + t * 30) * Math.PI / 180, a1 = mn * Math.PI / 180, a0 = a1 - span, r = 100;
    $("#trail").setAttribute("d", `M0 0 L${Math.sin(a0) * r} ${-Math.cos(a0) * r} A${r} ${r} 0 0 1 ${Math.sin(a1) * r} ${-Math.cos(a1) * r} Z`);
    // The chores stack up; older ones dim
    const at = [0.2, 0.7, 1.2, 1.75];
    $$(".w").forEach((w, i) => {
      const p = easeOut(seg(t, at[i], at[i] + 0.3));
      const newer = at.filter((x, j) => j > i && t >= x).length;
      w.style.opacity = p * (i === 3 ? 1 : Math.max(0.28, 1 - newer * 0.28));
      w.style.transform = `translateX(${(1 - p) * 40}px)`;
    });
  }
};
</script>
</body></html>
