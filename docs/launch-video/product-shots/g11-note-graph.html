<!doctype html>
<!-- Shot 11, 0:45.5 (about 5.6 s): "Obsidian, Notion, all of them. And honestly? The graphs are gorgeous."
     A stand-in for a screen recording: a generic note app's graph view, grey nodes and links slowly drifting and rotating.
     Generic on purpose: no third-party UI or logo. Note titles are synthetic (Parts Unlimited, billing sync), with two small Phoenix Project nods among them. -->
<html class="light"><head><meta charset="utf-8"><title>G11 Note Graph</title>
<link rel="stylesheet" href="assets/app.css">
<script src="engine.js"></script>
<style>
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #faf9f6; color: #172522; font-family: var(--font-sans, Inter, sans-serif); }
  #cursor { display: none !important; }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 320px; background: #f3f2ee; border-right: 1px solid #dfddd7; padding: 30px 22px; font-size: 18px; color: #6b6b6b; }
  .side .h { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #8a8a8a; font-weight: 600; margin: 8px 12px 10px; }
  .side .n { padding: 8px 12px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .n::before { content: ""; display: inline-block; width: 12px; height: 15px; border: 1.5px solid #b5b1a8; border-radius: 2px; margin-right: 12px; vertical-align: -2px; }
  .tabs { position: absolute; left: 320px; right: 0; top: 0; height: 54px; background: #ffffff; border-bottom: 1px solid #dfddd7; display: flex; align-items: flex-end; padding: 0 16px; gap: 4px; }
  .tab { font-size: 17px; color: #8a8a8a; padding: 13px 22px; border-radius: 8px 8px 0 0; }
  .tab.on { background: #faf9f6; color: #172522; border: 1px solid #dfddd7; border-bottom-color: #faf9f6; margin-bottom: -1px; }
  canvas { position: absolute; left: 320px; top: 54px; }
  .ctl { position: absolute; right: 28px; top: 78px; border: 1px solid #dfddd7; background: #f3f2ee; border-radius: 10px; padding: 14px 18px; font-size: 15px; color: #6b6b6b; width: 220px; }
  .ctl div { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  .ctl i { display: inline-block; width: 90px; height: 4px; border-radius: 2px; background: #d6d3cc; position: relative; }
  .ctl i b { position: absolute; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #6b6b6b; }
</style></head>
<body>
<div class="side" id="side"></div>
<div class="tabs"><div class="tab">Daily note</div><div class="tab on">Graph view</div></div>
<canvas id="cv" width="1600" height="1026"></canvas>
<div class="ctl"><div>Forces</div><div>Center <i><b style="left:30px"></b></i></div><div>Links <i><b style="left:58px"></b></i></div><div>Repel <i><b style="left:44px"></b></i></div></div>
<script>
const NOTES = ["Billing sync", "Parts Unlimited", "Onboarding", "Pricing tiers", "Weekly sync", "Ideas", "The Three Ways", "Deploy steps", "Brent 1:1 notes", "Parts Unlimited", "Q3 roadmap", "Invoice errors", "On-call", "Refund rules", "Data retention"];
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const gauss = (r) => { let s = 0; for (let i = 0; i < 4; i++) s += r(); return (s - 2) / 1.15; };

// A clustered graph in 3D: hubs on a sphere, notes scattered around them, a few cross-links
function makeGraph(seed, hubs, perHub) {
  const r = rng(seed), nodes = [], links = [];
  for (let h = 0; h < hubs; h++) {
    const u = r() * 2 - 1, th = (h + r() * 0.6) / hubs * Math.PI * 2, R = 250 + r() * 70, s = Math.sqrt(1 - u * u);
    const hub = { x: Math.cos(th) * s * R, y: u * R * 0.7, z: Math.sin(th) * s * R, deg: 0, hub: true, label: NOTES[h % NOTES.length], c: h };
    nodes.push(hub);
    const n = perHub[0] + Math.floor(r() * (perHub[1] - perHub[0]));
    const first = nodes.length;
    for (let i = 0; i < n; i++) {
      const sp = 70 + r() * 60;
      nodes.push({ x: hub.x + gauss(r) * sp, y: hub.y + gauss(r) * sp, z: hub.z + gauss(r) * sp, deg: 0, c: h });
      links.push([nodes.indexOf(hub), nodes.length - 1]);
      if (i > 1 && r() < 0.35) links.push([first + Math.floor(r() * i), nodes.length - 1]);
    }
  }
  const hubIdx = nodes.map((n, i) => (n.hub ? i : -1)).filter((i) => i >= 0);
  for (let i = 0; i < hubIdx.length; i++) for (let j = i + 1; j < hubIdx.length; j++) if (r() < 0.32) links.push([hubIdx[i], hubIdx[j]]);
  for (let k = 0; k < hubs * 2; k++) { const a = Math.floor(r() * nodes.length), b = Math.floor(r() * nodes.length); if (a !== b) links.push([a, b]); }
  for (let k = 0; k < 18; k++) nodes.push({ x: gauss(r) * 340, y: gauss(r) * 220, z: gauss(r) * 340, deg: 0, c: -1 }); // orphans
  for (const [a, b] of links) { nodes[a].deg++; nodes[b].deg++; }
  nodes.forEach((n, i) => { n.ph = r() * 6.28; n.amp = 4 + r() * 8; });
  return { nodes, links };
}

const G = makeGraph(11, 10, [8, 17]);
const W = 1600, H = 1026, F = 1500;
function project(n, t, rotY, rotX) {
  const dx = Math.sin(t * 0.9 + n.ph) * n.amp, dy = Math.cos(t * 0.7 + n.ph * 1.3) * n.amp;
  let x = n.x + dx, y = n.y + dy, z = n.z;
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  [x, z] = [x * cy + z * sy, -x * sy + z * cy];
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  [y, z] = [y * cx - z * sx, y * sx + z * cx];
  const s = F / (F + z + 300);
  return { x: W / 2 + x * s * 1.8, y: H / 2 + y * s * 1.8, s, z };
}

window.SCENE = { duration: 5.6,
  setup() { $("#side").innerHTML = `<div class="h">Notes</div>` + NOTES.map((n) => `<div class="n">${n}</div>`).join(""); },
  frame(t) {
    camera(t, 5.6, 1.0, 1.03, "58%", "50%");
    const ctx = $("#cv").getContext("2d");
    ctx.clearRect(0, 0, W, H);
    const fade = easeOut(seg(t, 0, 0.6));
    const P = G.nodes.map((n) => project(n, t, 0.35 + t * 0.11, -0.22 + Math.sin(t * 0.4) * 0.04));
    ctx.globalAlpha = fade;
    ctx.lineWidth = 1.2;
    for (const [a, b] of G.links) {
      const d = clamp(1 - ((P[a].z + P[b].z) / 2 + 400) / 1100, 0.25, 1);
      ctx.strokeStyle = `rgba(80,80,80,${0.26 * d})`;
      ctx.beginPath(); ctx.moveTo(P[a].x, P[a].y); ctx.lineTo(P[b].x, P[b].y); ctx.stroke();
    }
    const order = P.map((p, i) => i).sort((i, j) => P[j].z - P[i].z);
    ctx.font = "500 15px Inter, sans-serif"; ctx.textAlign = "center";
    for (const i of order) {
      const n = G.nodes[i], p = P[i];
      const d = clamp(1 - (p.z + 400) / 1100, 0.3, 1);
      const r = (n.hub ? 9 : 3.2 + Math.min(n.deg, 6) * 0.55) * p.s * 1.6;
      const g = Math.round(165 - 75 * d);
      ctx.fillStyle = `rgb(${g},${g},${g})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      if (n.hub) { ctx.fillStyle = `rgba(70,70,70,${0.9 * d})`; ctx.fillText(n.label, p.x, p.y + r + 20); }
    }
    ctx.globalAlpha = 1;
  }
};
</script>
</body></html>
